name: Fix Candidate AI helper typing

on:
  push:
    paths:
      - .github/workflows/fix-candidate-ai-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abc-finite-observed-monitor-coupled-evidence-joint-parameter-reestimation
      - name: Repair helper and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/test/finite_observed_monitor_coupled_evidence_multi_trajectory_joint_parameter_reestimation.test_helpers.ts')
          s = p.read_text()
          old = "  const stepLikelihoods = options.stepLikelihoods ?? Array.from({ length: horizon }, () => ({}));"
          new = "  const stepLikelihoods: Array<Record<string, number>> = options.stepLikelihoods ?? Array.from({ length: horizon }, () => ({}));"
          if s.count(old) != 1:
              raise SystemExit(f'expected one helper target, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/fix-candidate-ai-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/test/finite_observed_monitor_coupled_evidence_multi_trajectory_joint_parameter_reestimation.test_helpers.ts
          git commit -m 'Fix Candidate AI helper typing'
          git push origin HEAD:agent/abc-finite-observed-monitor-coupled-evidence-joint-parameter-reestimation
