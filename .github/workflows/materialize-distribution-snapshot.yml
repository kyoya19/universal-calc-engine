name: Materialize Distribution Snapshot

on:
  push:
    branches:
      - agent/distribution-hardening-v1

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout distribution branch
        uses: actions/checkout@v6
        with:
          ref: agent/distribution-hardening-v1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Fix distribution harness source-map boundary and remove temporary manifest upload
        shell: python
        run: |
          from pathlib import Path

          harness = Path('scripts/qualify-distribution.mjs')
          text = harness.read_text()
          old = "    /\\.ts$/,\n"
          new = "    /^(?!.*\\.d\\.ts$).*\\.ts$/,\n"
          if old not in text and new not in text:
              raise SystemExit('expected TypeScript denylist pattern not found')
          text = text.replace(old, new)
          harness.write_text(text)

          workflow = Path('.github/workflows/distribution-qualification.yml')
          text = workflow.read_text()
          block = """      - name: Upload generated package API manifest
          uses: actions/upload-artifact@v7
          with:
            name: generated-package-api-v1-node-${{ matrix.node }}
            path: docs/package-api-v1.json
            if-no-files-found: error
            retention-days: 7

"""
          text = text.replace(block, '')
          workflow.write_text(text)

      - name: Align package-lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Materialize exact package API v1 snapshot
        run: npm run package:api:generate

      - name: Commit materialized distribution files
        shell: bash
        run: |
          if git diff --quiet -- docs/package-api-v1.json package-lock.json scripts/qualify-distribution.mjs .github/workflows/distribution-qualification.yml; then
            echo "Distribution snapshot already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package-api-v1.json package-lock.json scripts/qualify-distribution.mjs .github/workflows/distribution-qualification.yml
          git commit -m "Materialize distribution qualification snapshot"
          git push origin HEAD:agent/distribution-hardening-v1
