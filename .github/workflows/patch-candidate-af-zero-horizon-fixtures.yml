name: Patch Candidate AF zero-horizon fixtures

on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-map-hidden-trajectory-decoding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-map-hidden-trajectory-decoding
      - name: Mark zero-horizon no-edge states terminal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/test/finite_map_hidden_trajectory_decoding.test.ts')
          s = p.read_text()
          s = s.replace("states: [{ id: 'a' }, { id: 'b' }], transitions: []", "states: [{ id: 'a', terminal: true }, { id: 'b', terminal: true }], transitions: []")
          s = s.replace("states: [{ id: 'a' }, { id: 'b' }, { id: 'c' }], transitions: []", "states: [{ id: 'a', terminal: true }, { id: 'b', terminal: true }, { id: 'c', terminal: true }], transitions: []")
          s = s.replace("states: [{ id: 's' }], transitions: []", "states: [{ id: 's', terminal: true }], transitions: []")
          p.write_text(s)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/test/finite_map_hidden_trajectory_decoding.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Candidate AF zero-horizon qualification fixtures"
          git push
