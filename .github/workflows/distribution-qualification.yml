name: Distribution Qualification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.14.0
          - 24.18.1

    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Bind candidate evidence to checked-out commit on PR head
        if: github.event_name == 'pull_request' && matrix.node == '24.18.1'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/qualify-current-distribution.mjs';
          const source = fs.readFileSync(path, 'utf8');
          const before = "  const candidateCommit = process.env.GITHUB_SHA ?? null;";
          const after = "  const candidateCommit = run('git', ['rev-parse', 'HEAD'], rootDir, true).stdout.trim();";
          const count = source.split(before).length - 1;
          if (count === 0 && source.includes(after)) process.exit(0);
          if (count !== 1) throw new Error(`unexpected candidateCommit binding count: ${count}`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          if git diff --quiet -- scripts/qualify-current-distribution.mjs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qualify-current-distribution.mjs
          git commit -m 'Bind distribution evidence to checked-out commit'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Install deterministic npm CLI
        run: npm install --global npm@11.16.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Record exact toolchain
        run: |
          node --version
          npm --version
          npx tsc --version

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate current package API manifest
        run: npm run package:api:generate

      - name: Verify current-generation npm package identity
        env:
          ORF_NPM_IDENTITY_LIFECYCLE: current_generation_prepublication
        run: npm run distribution:identity

      - name: Run current-generation prepublication qualification
        run: npm run package:check

      - name: Record supported-Node matrix evidence
        run: |
          mkdir -p qualification-output
          node -e "const fs=require('fs');fs.writeFileSync('qualification-output/current-generation-node-${{ matrix.node }}.json',JSON.stringify({schemaVersion:1,testId:'CURRENT-GENERATION-NODE',status:'PASS',requestedNode:'${{ matrix.node }}',executedNode:process.version,platform:process.platform,arch:process.arch},null,2)+'\n')"

      - name: Upload current-generation distribution qualification evidence
        uses: actions/upload-artifact@v7
        with:
          name: current-generation-distribution-qualification-node-${{ matrix.node }}
          path: |
            qualification-output/
            package-lock.json
          if-no-files-found: error
          retention-days: 30
