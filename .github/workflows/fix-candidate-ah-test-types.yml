name: Temporary Candidate AH test type fixes
on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-multi-trajectory-initial-transition-reestimation
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-multi-trajectory-initial-transition-reestimation
      - name: Apply exact test-only type fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          helper = Path('packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.test_helpers.ts')
          s = helper.read_text()
          replacements = [
              (
                  "const initial = new Map(states.map((stateId) => [stateId, 0] as const));",
                  "const initial = new Map<StateId, number>(states.map((stateId) => [stateId, 0]));"
              ),
              (
                  "const initialCounts = new Map(states.map((stateId) => [stateId, 0] as const));",
                  "const initialCounts = new Map<StateId, number>(states.map((stateId) => [stateId, 0]));"
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'helper replacement count for {old!r}: {s.count(old)}')
              s = s.replace(old, new)
          helper.write_text(s)

          meta = Path('packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.metamorphic.test.ts')
          m = meta.read_text()
          m2, count = re.subn(r"\{ id: '[^']+', from:", "{ from:", m)
          if count != 9:
              raise SystemExit(f'expected 9 transition-id removals, found {count}')
          meta.write_text(m2)
          PY
      - name: Commit test-only type fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.test_helpers.ts packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.metamorphic.test.ts
          git commit -m 'Fix Candidate AH test-only TypeScript types'
          git push origin HEAD:agent/abc-finite-monitor-coupled-evidence-multi-trajectory-initial-transition-reestimation
