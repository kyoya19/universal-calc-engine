name: Recover Candidate AG payload application

on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding
      - name: Recover embedded AG payload and remove temporary workflows
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('.github/workflows/apply-candidate-ag.yml', 'utf8');
          const startMarker = "<<'PAYLOAD'\n";
          const endMarker = '\nPAYLOAD\n';
          const start = source.indexOf(startMarker);
          if (start < 0) throw new Error('AG payload start marker not found');
          const bodyStart = start + startMarker.length;
          const end = source.indexOf(endMarker, bodyStart);
          if (end < 0) throw new Error('AG payload end marker not found');
          const payload = source.slice(bodyStart, end).replace(/\s+/g, '');
          if (!/^[A-Za-z0-9+/=]+$/.test(payload)) {
            const invalid = [...payload].find((character) => !/[A-Za-z0-9+/=]/.test(character));
            throw new Error(`AG payload contains invalid character ${JSON.stringify(invalid)}`);
          }
          fs.writeFileSync('/tmp/agfiles.tgz', Buffer.from(payload, 'base64'));
          NODE
          tar -xzf /tmp/agfiles.tgz -C .
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/core/src/index.ts';
          const line = "export * from './finite_monitor_coupled_evidence_ambiguity_preserving_ranked_k_best_hidden_trajectory_decoding';";
          let s = fs.readFileSync(path, 'utf8');
          if (!s.includes(line)) {
            if (!s.endsWith('\n')) s += '\n';
            s += line + '\n';
            fs.writeFileSync(path, s, 'utf8');
          }
          NODE
          rm .github/workflows/apply-candidate-ag.yml
          rm .github/workflows/recover-candidate-ag.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Candidate AG ranked K-best decoding implementation and qualification tests"
          git push
