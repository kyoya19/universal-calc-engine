name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Capture dependency diagnostics
        shell: bash
        run: |
          npm ls --all --json > dependency-tree.json || true
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Upload dependency diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: dependency-diagnostics
          path: |
            package-lock.json
            dependency-tree.json
            npm-audit.json
            npm-audit-production.json
          if-no-files-found: error

      - name: Commit npm-generated lockfile
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
          cp /tmp/package-lock.json package-lock.json
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Lock npm dependency graph"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package smoke test
        run: npm run package:check
