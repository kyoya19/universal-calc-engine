name: Publish Package

on:
  push:
    tags:
      - 'package-v*'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Exact immutable release confirmation'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Verify one-time recovery confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
        run: test "${RECOVERY_CONFIRMATION}" = "package-v1.1.0@76e7ace7e06ab33753d573b7e6d42abc717c178f"

      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/tags/package-v1.1.0' || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable deterministic npm CLI
        run: npm install --global npm@11.16.0

      - name: Verify exact immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SUBJECT="76e7ace7e06ab33753d573b7e6d42abc717c178f"
          EXPECTED_CURRENT_TAG="package-v1.1.0"
          EXPECTED_HISTORICAL_TAG_TARGET="bddff4fcc4f744c8b5e9ac7868a6ca40e7163e47"
          VERSION="$(node -p "require('./package.json').version")"
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          CURRENT_TAG_TARGET="$(git ls-remote origin refs/tags/package-v1.1.0 | cut -f1)"
          HISTORICAL_TAG_TARGET="$(git ls-remote origin refs/tags/package-v1.0.0 | cut -f1)"

          test "${VERSION}" = "1.1.0"
          test "${CHECKED_OUT_HEAD}" = "${EXPECTED_SUBJECT}"
          test "${CURRENT_TAG_TARGET}" = "${EXPECTED_SUBJECT}"
          test "${HISTORICAL_TAG_TARGET}" = "${EXPECTED_HISTORICAL_TAG_TARGET}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_NAME}" = "${EXPECTED_CURRENT_TAG}"
            test "${GITHUB_SHA}" = "${EXPECTED_SUBJECT}"
          else
            test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Revalidate prepublication npm identity
        env:
          ORF_NPM_IDENTITY_LIFECYCLE: current_generation_prepublication
        run: npm run distribution:identity

      - name: Qualify exact 1.1.0 tarball
        run: npm run package:check

      - name: Verify immutable qualified tarball SHA-256
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_TARBALL_SHA256="b7259abcdfac9b1c0ac70103597f97d88cae17d7d0a37f1b18ce717dd4615537"
          OBSERVED_TARBALL_SHA256="$(tr -d '\r\n' < qualification-output/packed-tarball-sha256-node-24.18.1.txt)"
          test "${OBSERVED_TARBALL_SHA256}" = "${EXPECTED_TARBALL_SHA256}"
          test -f qualification-output/universal-calc-engine-1.1.0.tgz

      - name: Upload exact prepublication evidence before publication
        uses: actions/upload-artifact@v7
        with:
          name: current-generation-1.1.0-prepublication
          path: qualification-output/
          if-no-files-found: error
          retention-days: 30

      - name: Reconfirm 1.1.0 remains absent immediately before publication
        env:
          ORF_NPM_IDENTITY_LIFECYCLE: current_generation_prepublication
        run: npm run distribution:identity

      - name: Publish exact qualified tarball with npm Trusted Publishing and provenance
        run: npm publish qualification-output/universal-calc-engine-1.1.0.tgz --provenance

      - name: Verify latest resolves to 1.1.0
        run: test "$(npm view universal-calc-engine@latest version)" = "1.1.0"

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.14.0
          - 24.18.1

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/package-v1.1.0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install deterministic npm CLI
        run: npm install --global npm@11.16.0

      - name: Download exact prepublication evidence
        uses: actions/download-artifact@v8
        with:
          name: current-generation-1.1.0-prepublication
          path: qualification-output

      - name: Verify published registry artifact on supported Node
        env:
          ORF_PREPUBLICATION_MANIFEST: qualification-output/normalized-manifest-node-24.18.1.json
          ORF_PREPUBLICATION_TARBALL_SHA256: qualification-output/packed-tarball-sha256-node-24.18.1.txt
        run: node scripts/verify-current-registry-release.mjs

      - name: Upload postpublication verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: current-generation-1.1.0-postpublication-node-${{ matrix.node }}
          path: qualification-output/current-generation-postpublish-node-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 30
