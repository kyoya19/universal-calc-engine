name: Sync Candidate AF API manifest

on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-map-hidden-trajectory-decoding

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-map-hidden-trajectory-decoding
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run package:api:generate
      - name: Commit generated manifest only
        run: |
          git diff --check
          git diff -- docs/package-api-v1.json
          if git diff --quiet -- docs/package-api-v1.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package-api-v1.json
          git commit -m "Synchronize Candidate AF package API manifest"
          git push
