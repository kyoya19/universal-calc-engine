name: Fix Candidate AI reduction typing

on:
  push:
    paths:
      - .github/workflows/fix-candidate-ai-reduction-typing.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abc-finite-observed-monitor-coupled-evidence-joint-parameter-reestimation
      - name: Repair reduction typing and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/test/finite_observed_monitor_coupled_evidence_multi_trajectory_joint_parameter_reestimation.reductions.test.ts')
          s = p.read_text()
          old = "      recordId: record.recordId,\n      horizon: record.horizon,"
          new = "      ...(record.recordId === undefined ? {} : { recordId: record.recordId }),\n      horizon: record.horizon,"
          if s.count(old) != 1:
              raise SystemExit(f'expected one reduction target, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/fix-candidate-ai-reduction-typing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/test/finite_observed_monitor_coupled_evidence_multi_trajectory_joint_parameter_reestimation.reductions.test.ts
          git commit -m 'Fix Candidate AI reduction typing'
          git push origin HEAD:agent/abc-finite-observed-monitor-coupled-evidence-joint-parameter-reestimation
