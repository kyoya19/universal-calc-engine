name: Temporary Candidate AH test refinements
on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-multi-trajectory-initial-transition-reestimation
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-multi-trajectory-initial-transition-reestimation
      - name: Refine numeric comparison and failure diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.core.test.ts')
          s = core.read_text()
          old = "      expect(captured.posteriorInitialStateProbabilities).toEqual(ae.smoothingSteps![0]!.hiddenStateDistribution);"
          new = "      for (const expected of ae.smoothingSteps![0]!.hiddenStateDistribution) {\n        const actual = captured.posteriorInitialStateProbabilities!.find((entry) => entry.stateId === expected.stateId);\n        expect(actual).toBeDefined();\n        expect(actual!.probability).toBeCloseTo(expected.probability, 14);\n      }"
          if s.count(old) != 1:
              raise SystemExit(f'core replacement count: {s.count(old)}')
          core.write_text(s.replace(old, new))

          meta = Path('packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.metamorphic.test.ts')
          m = meta.read_text()
          old = "function requireSuccess(result: ReturnType<typeof reestimateFiniteHiddenStateInitialAndTransitionsOneStepFromMonitorCoupledCalibratedEvidenceTrajectories>) {\n  expect(result.ok).toBe(true);\n  if (!result.ok || !result.possible) throw new Error(result.ok ? 'expected possible result' : result.failure.message);\n  return result;\n}"
          new = "function requireSuccess(result: ReturnType<typeof reestimateFiniteHiddenStateInitialAndTransitionsOneStepFromMonitorCoupledCalibratedEvidenceTrajectories>) {\n  if (!result.ok) throw new Error(`${result.failure.code}: ${result.failure.message}`);\n  expect(result.possible).toBe(true);\n  if (!result.possible) throw new Error('expected possible result');\n  return result;\n}"
          if m.count(old) != 1:
              raise SystemExit(f'metamorphic helper replacement count: {m.count(old)}')
          meta.write_text(m.replace(old, new))

          objective = Path('packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.objective.test.ts')
          o = objective.read_text()
          old = "    expect(result.ok).toBe(true);\n    if (!result.ok || !result.possible) throw new Error(result.ok ? 'expected possible result' : result.failure.message);\n    const row = result.transitionRows!.find((entry) => entry.stateId === 'b')!;"
          new = "    if (!result.ok) throw new Error(`${result.failure.code}: ${result.failure.message}`);\n    expect(result.possible).toBe(true);\n    if (!result.possible) throw new Error('expected possible result');\n    const row = result.transitionRows!.find((entry) => entry.stateId === 'b')!;"
          if o.count(old) != 1:
              raise SystemExit(f'objective replacement count: {o.count(old)}')
          objective.write_text(o.replace(old, new))
          PY
      - name: Commit qualification test refinements
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.core.test.ts packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.metamorphic.test.ts packages/core/test/finite_monitor_coupled_evidence_multi_trajectory_initial_transition_reestimation.objective.test.ts
          git commit -m 'Refine Candidate AH qualification test diagnostics'
          git push origin HEAD:agent/abc-finite-monitor-coupled-evidence-multi-trajectory-initial-transition-reestimation
