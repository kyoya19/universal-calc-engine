name: Synchronize Candidate AI API manifest

on:
  push:
    paths:
      - .github/workflows/sync-candidate-ai-api-manifest.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abc-finite-observed-monitor-coupled-evidence-joint-parameter-reestimation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Install and revalidate exact source/test head
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Generate API manifest and commit only expected final changes
        run: |
          npm run package:api:generate
          changed="$(git status --porcelain --untracked-files=no | sed 's/^...//')"
          if [ "$changed" != "docs/package-api-v1.json" ]; then
            echo "Unexpected tracked change before workflow cleanup:"
            git status --short
            exit 1
          fi
          git rm .github/workflows/candidate-ai-dev-check.yml
          git rm .github/workflows/sync-candidate-ai-api-manifest.yml
          git add docs/package-api-v1.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/candidate-ai-dev-check.yml' '.github/workflows/sync-candidate-ai-api-manifest.yml' 'docs/package-api-v1.json' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected staged files:"
            printf '%s\n' "$actual"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize Candidate AI generated API manifest'
          git push origin HEAD:agent/abc-finite-observed-monitor-coupled-evidence-joint-parameter-reestimation
