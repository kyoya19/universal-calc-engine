name: Cleanup Candidate AG API manifest workflow

on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding
      - name: Remove this temporary workflow
        run: |
          git rm .github/workflows/sync-candidate-ag-api-manifest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Candidate AG API manifest workflow"
          git push
