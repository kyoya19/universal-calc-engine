name: Synchronize Candidate AG API manifest

on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Generate and commit exact package API manifest
        run: |
          npm run package:api:generate
          git diff --check -- docs/package-api-v1.json
          if git diff --quiet -- docs/package-api-v1.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/package-api-v1.json
          git commit -m "Synchronize Candidate AG package API manifest"
          git push
