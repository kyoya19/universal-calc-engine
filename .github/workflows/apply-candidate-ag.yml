name: Apply Candidate AG source and qualification tests

on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding
      - name: Apply Candidate AG exact files
        shell: bash
        run: |
          cat > /tmp/agfiles.tgz.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/agfiles.tgz.b64 > /tmp/agfiles.tgz
          tar -xzf /tmp/agfiles.tgz -C .
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/core/src/index.ts';
          const line = "export * from './finite_monitor_coupled_evidence_ambiguity_preserving_ranked_k_best_hidden_trajectory_decoding';";
          let s = fs.readFileSync(path, 'utf8');
          if (!s.includes(line)) {
            if (!s.endsWith('\n')) s += '\n';
            s += line + '\n';
            fs.writeFileSync(path, s, 'utf8');
          }
          NODE
          git diff --check
          if git diff --quiet -- docs packages/core/src packages/core/test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/candidate-ag-finite-monitor-coupled-evidence-ambiguity-preserving-ranked-k-best-hidden-trajectory-decoding-v1.md
          git add packages/core/src/finite_monitor_coupled_evidence_ambiguity_preserving_ranked_k_best_hidden_trajectory_decoding.ts
          git add packages/core/src/index.ts
          git add packages/core/test/finite_ranked_k_best_hidden_trajectory_decoding*.ts
          git commit -m "Add Candidate AG ranked K-best decoding implementation and qualification tests"
          git push
