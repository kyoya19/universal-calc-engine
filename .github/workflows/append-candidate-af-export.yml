name: Append Candidate AF root export

on:
  push:
    branches:
      - agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-map-hidden-trajectory-decoding

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/abc-finite-monitor-coupled-evidence-ambiguity-preserving-map-hidden-trajectory-decoding
      - name: Append export
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/index.ts')
          s = p.read_text()
          line = "export * from './finite_monitor_coupled_evidence_ambiguity_preserving_map_hidden_trajectory_decoding';"
          if line not in s:
              if not s.endswith('\n'):
                  s += '\n'
              s += line + '\n'
              p.write_text(s)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Export Candidate AF MAP trajectory decoding APIs"
          git push
